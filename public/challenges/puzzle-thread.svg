<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <!-- Inside Out · puzzle (Maagdenhuis). Our own illustration in the spirit of the game: cloth, thread and a needle. Not a copy of an artwork. -->
  <defs>
    <pattern id="linen" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#e6e0d6"/><path d="M0 4H8" stroke="#d6cfc2" stroke-width="1"/></pattern>
    <pattern id="stripes" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#e6e0d6"/><rect width="7" height="16" fill="#4b1e23"/></pattern>
    <pattern id="check" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#c29095"/><rect width="12" height="24" fill="#4b1e23" opacity=".45"/><rect width="24" height="12" fill="#4b1e23" opacity=".45"/></pattern>
