    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#647c9f"/><circle cx="8" cy="8" r="3" fill="#e6e0d6"/></pattern>
  </defs>
  <rect width="600" height="600" fill="url(#linen)"/>
